packages:
  - apps/*
  - packages/*

# Versions shared by more than one workspace package. Reference them with
# "catalog:" in a package.json so every package moves in lockstep.
catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^26.6.6
  eslint: ^10.14.0
  globals: ^17.14.0
  # TS 6 is what `require('typescript')` resolves to (ESLint, editor tsserver);
  # TS 7 is the compiler `type-check` runs.
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-7: npm:typescript@^7.0.2
  typescript-eslint: ^8.72.1
  vitest: ^5.1.0
